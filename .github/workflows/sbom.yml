name: Generate SBOM

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

jobs:
  sbom:
    name: Generate and Sign SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99
      
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      
      - name: Generate CycloneDX SBOM
        run: |
          cargo sbom --output-format=cyclone_dx_json_1_5 > pond-sbom.json
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      
      - name: Sign SBOM with Sigstore
        run: |
          cosign sign-blob pond-sbom.json \
            --bundle pond-sbom.json.bundle \
            --yes
      
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            pond-sbom.json
            pond-sbom.json.bundle
          retention-days: 90
      
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            pond-sbom.json
            pond-sbom.json.bundle
