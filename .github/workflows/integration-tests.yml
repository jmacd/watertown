name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

env:
  RUST_BACKTRACE: 1
  TEST_TIMEOUT: 300

jobs:
  integration-tests:
    name: Container Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build test image
        working-directory: testsuite
        run: ./build-image.sh --quiet

      - name: Run container tests
        working-directory: testsuite
        run: ./run-all.sh --no-rebuild --skip-browser

      - name: Export tested images
        run: |
          set -euo pipefail
          docker save watertown-test:latest watertown-minio-test:latest \
            | gzip -1 > "$RUNNER_TEMP/integration-images.tar.gz"

      - name: Upload tested images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-images-${{ github.sha }}
          path: ${{ runner.temp }}/integration-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  compose-tests:
    name: Compose Tests (S3/MinIO)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Download tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-images-${{ github.sha }}
          path: ${{ runner.temp }}/integration-images

      - name: Load tested images
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/integration-images/integration-images.tar.gz"
          docker image inspect watertown-test:latest watertown-minio-test:latest > /dev/null
          rm "$RUNNER_TEMP/integration-images/integration-images.tar.gz"

      - name: Run compose tests
        working-directory: testsuite
        run: |
          for test in tests/*; do
            if head -25 "$test" | grep -q '# REQUIRES: compose'; then
              echo "--- Running: $(basename "$test") ---"
              ./run-test.sh --no-rebuild --compose "$test"
            fi
          done

  browser-tests:
    name: Browser Tests (Puppeteer)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install browser test dependencies
        working-directory: testsuite/browser
        run: npm ci

      - name: Audit browser test dependencies
        working-directory: testsuite/browser
        run: npm audit --audit-level=high

      - name: Install Chromium for Puppeteer
        working-directory: testsuite/browser
        run: npx puppeteer browsers install chrome

      - name: Download vendor dependencies
        run: make vendor

      - name: Download tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-images-${{ github.sha }}
          path: ${{ runner.temp }}/integration-images

      - name: Load tested images
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/integration-images/integration-images.tar.gz"
          docker image inspect watertown-test:latest watertown-minio-test:latest > /dev/null
          rm "$RUNNER_TEMP/integration-images/integration-images.tar.gz"

      - name: Run browser tests
        working-directory: testsuite
        env:
          TEST_TIMEOUT: 600
        run: ./run-test.sh --no-rebuild --timeout 600 202
