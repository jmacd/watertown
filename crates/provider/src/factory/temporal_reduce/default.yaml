in_pattern: series:///sensors/*  # Required: example source pattern.
out_pattern: "$0"               # Required: example output name from first capture.
time_column: timestamp          # Required: source event-time column.
group_by: []                    # Default: no additional grouping columns.
resolutions: [1h, 6h]            # Required: example aggregation windows.
aggregations:                   # Required: one or more aggregation operations.
  - type: avg                   # Required: example operation.
    columns: null               # Default: all eligible numeric columns.
transforms: null                # Default: no input transforms.
output_aliases: null            # Default: names such as temperature.avg.
allowed_lateness: 1d            # Effective default: one-day hot window.
seal_target_bytes: 1048576       # Effective default: 1 MiB before sealing.
max_live_segments: 50           # Effective default: compaction backstop.
