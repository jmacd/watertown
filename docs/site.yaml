site:
  title: Watertown development manual
  base_url: "/watertown/"
  github_url: https://github.com/jmacd/watertown
documentation:
  version: 1
  source_root: /docs/manual
  include_roots:
    - /testsuite/examples
strict: true
content:
  - name: reference
    pattern: "/docs/manual/reference/**/*.md"
  - name: guides
    pattern: "/docs/manual/guides/**/*.md"
routes:
  - name: home
    type: static
    slug: ""
    page: /docs/manual/index.md
    routes:
      - name: reference
        type: content
        slug: ""
        content: reference
      - name: guides
        type: content
        slug: ""
        content: guides
partials:
  sidebar: /docs/templates/sidebar.md
sidebar:
  - label: Manual home
    href: /index.html
  - label: Guides
    children:
      - label: Timeseries
        href: /guides/timeseries.html
      - label: Timeseries site
        href: /guides/timeseries-site.html
      - label: Blog and RSS
        href: /guides/blog.html
      - label: Operations
        href: /guides/operations.html
  - label: Reference
    children:
      - label: CLI
        href: /reference/cli/commands.html
      - label: Shared concepts
        href: /reference/concepts.html
      - label: Export
        href: /reference/export.html
      - label: Factories
        children:
          - label: Ingestion
            children:
              - label: Git
                href: /reference/factories/git-ingest.html
              - label: Rotating logs
                href: /reference/factories/logfile-ingest.html
              - label: Systemd journal
                href: /reference/factories/journal-ingest.html
              - label: HydroVu
                href: /reference/factories/hydrovu.html
          - label: SQL and transforms
            children:
              - label: SQL-derived table
                href: /reference/factories/sql-derived-table.html
              - label: SQL-derived series
                href: /reference/factories/sql-derived-series.html
              - label: Column rename
                href: /reference/factories/column-rename.html
              - label: Dynamic directory
                href: /reference/factories/dynamic-dir.html
          - label: Timeseries
            children:
              - label: Synthetic timeseries
                href: /reference/factories/synthetic-timeseries.html
              - label: Join
                href: /reference/factories/timeseries-join.html
              - label: Pivot
                href: /reference/factories/timeseries-pivot.html
              - label: Temporal reduction
                href: /reference/factories/temporal-reduce.html
              - label: Direct temporal reduction
                href: /reference/factories/temporal-reduce-series.html
              - label: Pump state
                href: /reference/factories/pump-state-series.html
              - label: Materialization
                href: /reference/factories/materialize-series.html
          - label: Exec
            href: /reference/factories/exec.html
          - label: Publishing and reports
            children:
              - label: Sitegen
                href: /reference/factories/sitegen.html
              - label: Monitor report
                href: /reference/factories/monitor-report.html
              - label: Email report
                href: /reference/factories/email-report.html
          - label: Storage and budgets
            children:
              - label: MinIO
                href: /reference/factories/storage-minio.html
              - label: Azure
                href: /reference/factories/storage-azure.html
              - label: Rate limit
                href: /reference/factories/rate-limit.html
      - label: Formats
        children:
          - label: CSV
            href: /reference/formats/csv.html
          - label: Other providers
            href: /reference/formats/providers.html
      - label: Sitegen
        children:
          - label: Configuration
            href: /reference/sitegen/configuration.html
          - label: Frontmatter
            href: /reference/sitegen/frontmatter.html
          - label: Shortcodes
            href: /reference/sitegen/shortcodes.html
          - label: Browser behavior
            href: /reference/sitegen/browser.html
static:
  - pattern: "/testsuite/examples/csv-query/*"
  - pattern: "/testsuite/examples/synthetic-timeseries/*"
  - pattern: "/testsuite/examples/documentation-pilot/*"
  - pattern: "/docs/manual/_generated/inventory.json"
footer: "Development manual; service/browser coverage is limited. Documentation version ${env:WATERTOWN_DOCS_VERSION:-development}; source ${env:WATERTOWN_DOCS_REVISION:-working-tree}."
